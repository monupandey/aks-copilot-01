name: terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action != 'plan')) && 'production' || 'plan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set deterministic resource identifier
        env:
          CONFIGURED_IDENTIFIER: ${{ vars.TF_RANDOM_IDENTIFIER }}
          APP_DEPLOYER_OBJECT_ID: ${{ vars.AKS_DEPLOYER_OBJECT_ID }}
          NAMESPACE_ACCESS_JSON: ${{ vars.TF_NAMESPACE_ACCESS_JSON }}
          RUNNER_ADMIN_SSH_PUBLIC_KEY: ${{ vars.RUNNER_ADMIN_SSH_PUBLIC_KEY }}
        run: |
          if [ -n "$CONFIGURED_IDENTIFIER" ]; then
            identifier="$CONFIGURED_IDENTIFIER"
          else
            identifier="$(printf '%s' "$GITHUB_REPOSITORY" | sha256sum | cut -c1-5)"
          fi

          if ! printf '%s' "$identifier" | grep -Eq '^[a-z0-9]{5,6}$'; then
            echo "TF_RANDOM_IDENTIFIER must contain 5-6 lowercase letters or digits"
            exit 1
          fi

          if [ -z "$RUNNER_ADMIN_SSH_PUBLIC_KEY" ]; then
            echo "Set repository variable RUNNER_ADMIN_SSH_PUBLIC_KEY to an SSH public key"
            exit 1
          fi

          echo "TF_VAR_random_identifier=$identifier" >> "$GITHUB_ENV"
          echo "TF_VAR_runner_admin_ssh_public_key=$RUNNER_ADMIN_SSH_PUBLIC_KEY" >> "$GITHUB_ENV"
          if [ -n "$APP_DEPLOYER_OBJECT_ID" ]; then
            echo "TF_VAR_app_deployer_service_principal_object_id=$APP_DEPLOYER_OBJECT_ID" >> "$GITHUB_ENV"
          fi
          if [ -n "$NAMESPACE_ACCESS_JSON" ]; then
            echo "TF_VAR_namespace_access=$NAMESPACE_ACCESS_JSON" >> "$GITHUB_ENV"
          fi
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
      - if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -out=tfplan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.action == 'apply' || github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform apply -input=false tfplan

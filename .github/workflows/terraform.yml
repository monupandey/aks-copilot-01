name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'plan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set deterministic resource identifier
        env:
          CONFIGURED_IDENTIFIER: ${{ vars.TF_RANDOM_IDENTIFIER }}
        run: |
          if [ -n "$CONFIGURED_IDENTIFIER" ]; then
            identifier="$CONFIGURED_IDENTIFIER"
          else
            identifier="$(printf '%s' "$GITHUB_REPOSITORY" | sha256sum | cut -c1-5)"
          fi

          if ! printf '%s' "$identifier" | grep -Eq '^[a-z0-9]{5,6}$'; then
            echo "TF_RANDOM_IDENTIFIER must contain 5-6 lowercase letters or digits"
            exit 1
          fi

          echo "TF_VAR_random_identifier=$identifier" >> "$GITHUB_ENV"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - name: Import existing resource group when needed
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
        run: |
          resource_group_name="rg-manish-cin-dev-${TF_VAR_random_identifier}-01"
          resource_group_id=$(az group show --name "$resource_group_name" --query id --output tsv 2>/dev/null || true)

          if [ -n "$resource_group_id" ] && ! terraform state list 2>/dev/null | grep -Fxq 'azurerm_resource_group.this'; then
            terraform import -input=false azurerm_resource_group.this "$resource_group_id"
          fi
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan

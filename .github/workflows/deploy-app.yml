name: deploy-aks-store-demo

on:
  push:
    branches:
      - main
    paths:
      - "app/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-store-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, aks-private]
    environment: production
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      AKS_NAMESPACE: ${{ vars.AKS_NAMESPACE || 'pets' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment settings
        run: |
          test -n "$AKS_RESOURCE_GROUP" || { echo "Set repository variable AKS_RESOURCE_GROUP"; exit 1; }
          test -n "$AKS_CLUSTER_NAME" || { echo "Set repository variable AKS_CLUSTER_NAME"; exit 1; }
          command -v az >/dev/null || { echo "Azure CLI is required on this runner"; exit 1; }
          command -v kubectl >/dev/null || { echo "kubectl is required on this runner"; exit 1; }
          command -v kubelogin >/dev/null || { echo "kubelogin is required on this runner"; exit 1; }

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Deploy AKS Store Demo
        run: |
          kubectl get pods --namespace "$AKS_NAMESPACE" >/dev/null || {
            echo "Namespace '$AKS_NAMESPACE' must exist and the deploy identity needs namespace access."
            exit 1
          }
          kubectl apply -f app/aks-store-all-in-one.yaml --namespace "$AKS_NAMESPACE"
          kubectl wait --for=condition=Ready pods --all \
            --namespace "$AKS_NAMESPACE" \
            --timeout=15m
          kubectl get services --namespace "$AKS_NAMESPACE"
